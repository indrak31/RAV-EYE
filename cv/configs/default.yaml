# default.yaml — settings the pipeline reads at startup.
# Owner: Meghana. Edit these instead of hardcoding numbers in code.

model:
  detector_path: models/yolov8n.pt
  device: cuda          # "cuda" on the TUF, "cpu" as a fallback
  image_size: 640        # per hardware plan: 640px, batch<=8 for fine-tune, batch=1 for inference

tracker:
  track_thresh: 0.5

# Per-camera overrides can live in cameras.yaml later (not created yet —
# only one demo camera for now, so this file's defaults are enough).
camera:
  camera_id: CAM-DEMO-01
  # Calibrated 2026-08-20 against "videoplayback (1).mp4" (Kolkata
  # intersection clip), frame 100, resolution 480x854. [x1,y1,x2,y2] is
  # two points tracing the crosswalk/stop-line on the road, confirmed
  # visually against the actual footage. ONLY valid for this exact camera
  # angle/framing — a different clip/camera needs its own calibration
  # (repeat the same process: grab a frame, overlay a pixel grid, eyeball
  # the line, confirm against the drawn overlay).
  stop_line: [170, 445, 430, 450]

evidence:
  output_dir: media/evidence
